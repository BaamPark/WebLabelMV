services:
  mongo:
    image: mongo:6
    container_name: labelmv-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./labelmv-backend
    container_name: labelmv-backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/labelmv
      - SECRET_KEY=${SECRET_KEY:-changeme-in-prod}
      - CHATBOT_PROVIDER=${CHATBOT_PROVIDER:-ollama}
      - CHATBOT_BASE_URL=${CHATBOT_BASE_URL:-http://host.docker.internal:11434}
      - CHATBOT_REQUEST_PATH=${CHATBOT_REQUEST_PATH:-/api/chat}
      - CHATBOT_API_KEY=${CHATBOT_API_KEY:-}
      - CHATBOT_MODEL=${CHATBOT_MODEL:-qwen3-vl:8b-instruct}
      - CHATBOT_OLLAMA_THINK=${CHATBOT_OLLAMA_THINK:-false}
      - CHATBOT_TIMEOUT_SECONDS=${CHATBOT_TIMEOUT_SECONDS:-180}
      - CHATBOT_MAX_TOKENS=${CHATBOT_MAX_TOKENS:-256}
      - CHATBOT_SEED=${CHATBOT_SEED:-}
      - CHATBOT_TEMPERATURE=${CHATBOT_TEMPERATURE:-0.2}
      - CHATBOT_MAX_IMAGE_BYTES=${CHATBOT_MAX_IMAGE_BYTES:-5242880}
      - AGENT_INPUT_LOGGING=${AGENT_INPUT_LOGGING:-false}
      - ML_BACKEND_URL=${ML_BACKEND_URL:-http://host.docker.internal:8001/detect}
      - AGENT_MAX_TOOL_STEPS=${AGENT_MAX_TOOL_STEPS:-4}
    depends_on:
      - mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount videos from host to container; point your project to /app/videos
      - ./videos:/app/videos:ro
    ports:
      - "56250:56250"

  frontend:
    build:
      context: ./labelmv-frontend
      args:
        # Make '/videos' go to same-origin and be proxied by Nginx
        REACT_APP_API_BASE: ""
    container_name: labelmv-frontend
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  mongo-data:
